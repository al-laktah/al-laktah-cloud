# NetBird: the control server of the WireGuard VPN, on its own VM (the second AMD
# micro, see netbird.tf). Devices use it to log in and to find each other. Their
# traffic goes directly between them when it can, and through the relay here when
# it can't. Modelled on what NetBird's getting-started.sh generates for an
# external Caddy, with the secrets moved to 1Password.
name: netbird

services:
  # This VM serves nothing else, so the stack brings its own Caddy instead of the
  # edge stack, and Caddy reaches the other containers over the stack's own network.
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in services/config.env}
    labels:
      # deploy.sh fingerprints the stack, so a changed Caddyfile recreates Caddy.
      stack-hash: ${STACK_HASH:-}
    volumes:
      - ./caddy:/etc/caddy:ro # the folder, not the file (see edge/compose.yaml)
      - caddy-data:/data # certificate and ACME account
      - caddy-config:/config
    networks:
      default:
        # Fixed, so the server can trust forwarded client IPs from Caddy and nobody else.
        ipv4_address: 172.30.0.10

  # Management, signal, relay and STUN in one process.
  server:
    image: netbirdio/netbird-server:0.81.4
    restart: unless-stopped
    command: ["--config", "/etc/netbird/config.yaml"]
    ports:
      - "3478:3478/udp" # STUN goes straight to the server; Caddy only handles HTTP
    configs:
      - source: server-config
        target: /etc/netbird/config.yaml
    labels:
      # Compose recreates a container only when its own definition changes, not
      # when a config it mounts does. The fingerprint covers the config and secrets.
      stack-hash: ${STACK_HASH:-}
    volumes:
      # SQLite store (accounts, peers, policies) and the built-in login's keys and users.
      - data:/var/lib/netbird

  dashboard:
    image: netbirdio/dashboard:v2.95.0
    restart: unless-stopped
    environment:
      NETBIRD_MGMT_API_ENDPOINT: https://netbird.${DOMAIN}
      NETBIRD_MGMT_GRPC_API_ENDPOINT: https://netbird.${DOMAIN}
      # Signs in through the server's built-in identity provider (Dex). Pocket ID is
      # added there later, as an extra way to sign in (see services/README.md).
      AUTH_AUDIENCE: netbird-dashboard
      AUTH_CLIENT_ID: netbird-dashboard
      AUTH_CLIENT_SECRET: ""
      AUTH_AUTHORITY: https://netbird.${DOMAIN}/oauth2
      USE_AUTH0: "false"
      AUTH_SUPPORTED_SCOPES: openid profile email groups
      AUTH_REDIRECT_URI: /nb-auth
      AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
      NGINX_SSL_PORT: "443"
      LETSENCRYPT_DOMAIN: none # Caddy handles HTTPS

  # Nightly encrypted backups of the server's data to this VM's own bucket
  # (bootstrap/), with restic. Signs in to OCI as the VM itself (backup.tf).
  backup:
    build: ./backup
    image: services/netbird-backup:local
    restart: unless-stopped
    init: true # forwards `docker stop` to the sleeping scheduler
    hostname: netbird # restic groups snapshots by host, so keep it stable
    environment:
      BACKUP_TIME: ${NETBIRD_BACKUP_TIME:-02:00}
      RESTIC_REPOSITORY: rclone:oos:${NETBIRD_BACKUP_BUCKET:?set in services/config.env}/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?missing from .env.tpl}
      RESTIC_CACHE_DIR: /cache
      # rclone remote "oos": OCI Object Storage, signed in as the VM itself
      RCLONE_CONFIG_OOS_TYPE: oracleobjectstorage
      RCLONE_CONFIG_OOS_PROVIDER: instance_principal_auth
      RCLONE_CONFIG_OOS_NAMESPACE: ${OCI_NAMESPACE:?set in services/config.env}
      RCLONE_CONFIG_OOS_COMPARTMENT: ${OCI_COMPARTMENT_OCID:?set in services/config.env}
      RCLONE_CONFIG_OOS_REGION: ${OCI_REGION:?set in services/config.env}
    volumes:
      - data:/src/netbird # read-write, because SQLite needs its lock files
      - backup-cache:/cache

# The server takes its secrets only from its config file, so the file is written
# here, with the ${...} values filled in from the .env that deploy.sh renders.
configs:
  server-config:
    content: |
      server:
        listenAddress: ":80"
        exposedAddress: "https://netbird.${DOMAIN}:443"
        stunPorts:
          - 3478
        metricsPort: 9090
        healthcheckAddress: ":9000"
        logLevel: "info"
        logFile: "console"
        disableAnonymousMetrics: true

        authSecret: "${NETBIRD_AUTH_SECRET:?missing from .env.tpl}"
        dataDir: "/var/lib/netbird"

        auth:
          issuer: "https://netbird.${DOMAIN}/oauth2"
          signKeyRefreshEnabled: true
          sessionCookieEncryptionKey: "${NETBIRD_SESSION_KEY:?missing from .env.tpl}"
          dashboardRedirectURIs:
            - "https://netbird.${DOMAIN}/nb-auth"
            - "https://netbird.${DOMAIN}/nb-silent-auth"
          cliRedirectURIs:
            - "http://localhost:53000/"

        reverseProxy:
          trustedHTTPProxies:
            - "172.30.0.10/32"
          trustedPeers:
            - "172.30.0.10/32"

        store:
          engine: "sqlite"
          encryptionKey: "${NETBIRD_STORE_KEY:?missing from .env.tpl}"

volumes:
  data:
  caddy-data:
  caddy-config:
  backup-cache:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Other containers get addresses from the top half only, so none of them
          # can take Caddy's fixed one while Caddy is being recreated.
          ip_range: 172.30.0.128/25
