# The watchtower watches the main VM from outside it. Gatus checks the sites and
# alerts through ntfy; backup-check verifies the backups every day, read-only, and
# reports to Gatus. Deployed to the watchtower VM (DEPLOY_HOST_WATCHTOWER).
name: watchtower

services:
  gatus:
    image: twinproduction/gatus:v5.37.0
    restart: unless-stopped
    ports:
      # Dashboard and API on every interface, but only two ways in: OCI's firewall lets
      # just the main VM through, across the VCN (Homepage's Gatus widget), and your
      # devices come in over NetBird. Nothing reaches it from the internet.
      - "8080:8080"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in services/config.env}
      NTFY_TOPIC: ${NTFY_TOPIC:?missing from .env.tpl}
      GATUS_PUSH_TOKEN: ${GATUS_PUSH_TOKEN:?missing from .env.tpl}
      MAIN_VM_PRIVATE_IP: ${MAIN_VM_PRIVATE_IP:?set in services/config.env}
    # The VPN-only sites answer only NetBird and VCN addresses, so Gatus reaches them
    # across the VCN: these names point straight at the main VM's private IP. The public
    # sites (auth, shorti) are checked over the internet, the way visitors reach them.
    extra_hosts:
      - "wiki.${DOMAIN}:${MAIN_VM_PRIVATE_IP}"
      - "cloud.${DOMAIN}:${MAIN_VM_PRIVATE_IP}"
    volumes:
      - ./gatus:/config:ro
      - gatus-data:/data # check history (SQLite)

  backup-check:
    build: ./check
    image: services/backup-check:local
    restart: unless-stopped
    init: true # forwards `docker stop` to the sleeping scheduler
    environment:
      CHECK_TIME: ${CHECK_TIME:-06:00}
      WATCHTOWER_PING_URL: ${WATCHTOWER_PING_URL:-}
      GATUS_URL: http://gatus:8080
      GATUS_PUSH_TOKEN: ${GATUS_PUSH_TOKEN}
      RESTIC_REPOSITORY: rclone:oos:${BACKUP_BUCKET:?set in services/config.env}/restic
      NETBIRD_RESTIC_REPOSITORY: rclone:oos:${NETBIRD_BACKUP_BUCKET:?set in services/config.env}/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?missing from .env.tpl} # opens both repositories
      RESTIC_CACHE_DIR: /cache
      # rclone remote "oos": OCI Object Storage, signed in as the watchtower VM,
      # whose policy only allows reading (backup.tf)
      RCLONE_CONFIG_OOS_TYPE: oracleobjectstorage
      RCLONE_CONFIG_OOS_PROVIDER: instance_principal_auth
      RCLONE_CONFIG_OOS_NAMESPACE: ${OCI_NAMESPACE:?set in services/config.env}
      RCLONE_CONFIG_OOS_COMPARTMENT: ${OCI_COMPARTMENT_OCID:?set in services/config.env}
      RCLONE_CONFIG_OOS_REGION: ${OCI_REGION:?set in services/config.env}
    volumes:
      - cache:/cache
    depends_on:
      - gatus

volumes:
  gatus-data:
  cache:
