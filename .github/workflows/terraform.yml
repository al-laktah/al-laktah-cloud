# Checks formatting and validates both Terraform configs. Needs no cloud
# credentials: `init -backend=false` skips the state bucket, and `validate`
# never calls the OCI or Cloudflare APIs.
name: Terraform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # -lockfile=readonly fails the build if the committed .terraform.lock.hcl
      # doesn't cover the providers, instead of silently rewriting it.
      - name: Validate main config
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: Validate bootstrap config
        working-directory: bootstrap
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Each stack gets a stand-in .env: DOMAIN, plus every variable its .env.tpl
      # defines with a placeholder value. `${VAR:?}` in compose.yaml then fails the
      # check if a stack needs a secret its template doesn't provide.
      - name: Validate service stacks
        run: |
          for dir in services/*/; do
            [ -f "${dir}compose.yaml" ] || continue # not a stack this repo deploys
            {
              echo "DOMAIN=example.com"
              if [ -f "$dir.env.tpl" ]; then sed -E 's/\{\{ *op:\/\/[^}]*\}\}/ci-placeholder/' "$dir.env.tpl"; fi
            } > "$dir.env"
            (cd "$dir" && docker compose config --quiet)
            echo "ok: $dir"
          done
