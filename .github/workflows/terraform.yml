# Checks formatting and validates both Terraform configs. Needs no cloud
# credentials: `init -backend=false` skips the state bucket, and `validate`
# never calls the OCI or Cloudflare APIs.
name: Terraform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # -lockfile=readonly fails the build if the committed .terraform.lock.hcl
      # doesn't cover the providers, instead of silently rewriting it.
      - name: Validate main config
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: Validate bootstrap config
        working-directory: bootstrap
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Each stack gets a stand-in .env, like the one deploy.sh writes: the shared
      # settings from config.env.example, plus every variable its .env.tpl defines
      # with a placeholder value. `${VAR:?}` in compose.yaml then fails the check
      # if a stack needs a setting or secret that nothing provides.
      - name: Validate service stacks
        run: |
          for dir in services/*/; do
            [ -f "${dir}compose.yaml" ] || continue # not a stack this repo deploys
            {
              grep -E '^[A-Z_][A-Z0-9_]*=' services/config.env.example | grep -v '^DEPLOY_' | sed -E 's/[[:space:]]*#.*$//'
              if [ -f "$dir.env.tpl" ]; then sed -E 's/\{\{ *op:\/\/[^}]*\}\}/ci-placeholder/' "$dir.env.tpl"; fi
            } > "$dir.env"
            (cd "$dir" && docker compose config --quiet)
            echo "ok: $dir"
          done

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: "0.11.0"
      # GitHub's published digest for shellcheck-v0.11.0.linux.x86_64.tar.xz
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@v7

      # A pinned, checksummed release instead of whatever shellcheck the runner image
      # ships: an image update could bring new warnings and fail a build that
      # changed nothing.
      - name: Install ShellCheck
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  shellcheck.tar.xz" | sha256sum --check
          tar -xJf shellcheck.tar.xz
          echo "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION" >> "$GITHUB_PATH"

      # Every tracked *.sh file, so a new script is checked without editing this.
      # -x follows `# shellcheck source=` directives (deploy.sh's config.env.example).
      - name: Check shell scripts
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck -x
